name: Release

# Every merge to main is a release: the version comes from scripts/next-version.sh (Semantic
# Versioning, from the commit titles since the last tag), the Flatpak is built with that version,
# the tag vX.Y.Z is created and the Flatpak is attached to a GitHub release.
# Put [skip release] in the merge commit message to merge without a release.

on:
  push:
    branches: [main]
  # A pull request that touches the build builds the Flatpak too, but makes no tag and no release.
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "Makefile"
      - "VERSION"
      - "scripts/**"
      - "kde/packaging/**"
      - "kde/src/app/CMakeLists.txt"

permissions:
  contents: read

# One release at a time, so two merges cannot pick the same version.
concurrency:
  group: release-${{ github.event_name == 'push' && 'main' || github.ref }}
  cancel-in-progress: false

jobs:
  flatpak:
    if: ${{ !contains(github.event.head_commit.message, '[skip release]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: write   # creates the tag and the release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # the version needs the history and the tags
          fetch-tags: true

      - name: Pick the version
        id: version
        run: |
          version=$(scripts/next-version.sh)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$version" > /dev/null \
             || [ -n "$(git tag --points-at HEAD --list 'v[0-9]*')" ]; then
            echo "This commit is already released as v$version. Nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
          echo "Release version: $version"

      - name: Put the version in the build
        if: steps.version.outputs.skip != 'true'
        run: echo "${{ steps.version.outputs.version }}" > VERSION

      - name: Install Flatpak and the KDE runtime
        if: steps.version.outputs.skip != 'true'
        run: |
          sudo apt-get update
          # elfutils has eu-strip and eu-elfcompress, which flatpak-builder runs on the debug info.
          sudo apt-get install -y --no-install-recommends flatpak flatpak-builder elfutils
          # Ubuntu 24.04 blocks the user namespaces that flatpak-builder needs.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          make FLATPAK_BRANCH=6.10 flatpak-runtime

      - name: Build the Flatpak
        if: steps.version.outputs.skip != 'true'
        run: make FLATPAK_BUILDER="flatpak-builder --disable-rofiles-fuse" flatpak

      - name: Show why the build failed
        if: failure()
        run: |
          echo "--- appstreamcli and flatpak-builder versions"
          appstreamcli --version; flatpak-builder --version
          echo "--- files that AppStream reads"
          ls -laR build-flatpak/app/files/share/metainfo build-flatpak/app/files/share/applications || true
          cat build-flatpak/app/files/share/metainfo/*.metainfo.xml || true
          echo "--- appstreamcli compose, verbose"
          appstreamcli compose --verbose --origin=flatpak --prefix=/ \
            --components=io.github.multiclauds.clauds-kde,io.github.multiclauds.clauds-kde.desktop \
            --result-root=/tmp/compose-out --data-dir=/tmp/compose-out/data --icons-dir=/tmp/compose-out/icons \
            build-flatpak/app/files || true
          find /tmp/compose-out -name '*.yml' -o -name '*.json' | xargs -r cat

      - name: Name the bundle after the version
        if: steps.version.outputs.skip != 'true'
        id: bundle
        run: |
          bundle="io.github.multiclauds.clauds-kde-${{ steps.version.outputs.version }}.flatpak"
          cp build-flatpak/io.github.multiclauds.clauds-kde.flatpak "$bundle"
          echo "path=$bundle" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.version.outputs.skip != 'true'
        with:
          name: clauds-kde-flatpak
          path: ${{ steps.bundle.outputs.path }}

      - name: Tag and publish the release
        if: steps.version.outputs.skip != 'true' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          BUNDLE: ${{ steps.bundle.outputs.path }}
        run: |
          gh release create "v$VERSION" "$BUNDLE" \
            --target "$GITHUB_SHA" \
            --title "Clauds KDE $VERSION" \
            --generate-notes
