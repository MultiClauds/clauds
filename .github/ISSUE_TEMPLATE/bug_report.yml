name: Bug report
description: Something does not work as the README says.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for the report.
        **Do not paste account names, emails, account ids, or session files.**
        For a security problem, do not use this form. Read SECURITY.md.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what did you get?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Turn on Side by Side
        2. Click the second account
        3. ...
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Mode
      options:
        - Side by Side on
        - Side by Side off, Share Code Sessions on
        - Side by Side off, Share Code Sessions off
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Clauds version
      description: See "…" > About Clauds.
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: Operating system and version
      description: For example "Kubuntu 26.04, Plasma 6.6" or "macOS 15.5".
    validations:
      required: true
  - type: input
    id: claude
    attributes:
      label: Claude desktop app version
  - type: textarea
    id: more
    attributes:
      label: More information
      description: Error text, or a picture with private data removed.
