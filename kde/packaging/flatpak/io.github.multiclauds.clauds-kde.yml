# SPDX-License-Identifier: MIT
#
# Flatpak manifest for Clauds (KDE Plasma port). Build it with `make flatpak` from the
# repository root. See kde/README.md.
app-id: io.github.multiclauds.clauds-kde
runtime: org.kde.Platform
runtime-version: '6.10'
sdk: org.kde.Sdk
base: io.qt.qtwebengine.BaseApp
base-version: '6.10'
command: clauds

# The desktop file, the metainfo and the tray icon (...-symbolic) are named after the app ID.
# The app icon is not.
rename-icon: clauds

separate-locales: false
cleanup-commands:
  - /app/cleanup-BaseApp.sh

build-options:
  env:
    QTWEBENGINEPROCESS_PATH: /app/bin/QtWebEngineProcess

finish-args:
  # Display and GPU (Qt WebEngine draws the live usage and chat windows)
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --share=network
  # Tray icon and notifications
  - --talk-name=org.kde.StatusNotifierWatcher
  - --talk-name=org.freedesktop.Notifications
  # Clauds works on the real data folders of Claude Desktop and of itself. A switch renames
  # folders, so all of them must be on the same disk, in the real home folder.
  # Flatpak mounts a host folder only if it already exists. Without ":create" the app writes
  # into a throwaway folder inside the sandbox on first start, and the host never sees it.
  # ~/.config/Claude belongs to Claude Desktop, so Clauds does not create it.
  - --filesystem=xdg-config/Claude
  - --filesystem=xdg-data/clauds:create
  - --filesystem=xdg-data/Trash:create
  - --filesystem=xdg-config/autostart:create
  # Use the real XDG folders, not ~/.var/app/<id>/..., so the paths match kde/README.md.
  - --unset-env=XDG_CONFIG_HOME
  - --unset-env=XDG_DATA_HOME
  # Claude Desktop is a host program. Finding, quitting and starting it has to happen on the
  # host through flatpak-spawn --host. This is a sandbox escape that the owner approved,
  # because switching accounts is the whole job of the app.
  - --talk-name=org.freedesktop.Flatpak

modules:
  - name: clauds
    buildsystem: cmake-ninja
    subdir: kde
    config-opts:
      - -DCMAKE_BUILD_TYPE=RelWithDebInfo
      - -DBUILD_TESTING=OFF
      - -DCLAUDS_WITH_KF6=ON
    sources:
      - type: dir
        path: ../../..   # the repository root
        skip:
          - .git
          - build-kde
          - build-flatpak
          - .flatpak-builder
